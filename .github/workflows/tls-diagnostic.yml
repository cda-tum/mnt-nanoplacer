{
  "name": "Temporary TLS diagnostics follow-up (no publishing)",
  "on": {
    "push": {
      "branches": [
        "codex/tls-diagnostic-20261106"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "temporary-tls-diagnostics-${{ github.ref }}-followup",
    "cancel-in-progress": true
  },
  "env": {
    "NODE_OPTIONS": "--use-openssl-ca",
    "UV_PYTHON_DOWNLOADS": "never",
    "PIP_DISABLE_PIP_VERSION_CHECK": "1",
    "PIP_BOOTSTRAP_URL": "https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
  },
  "defaults": {
    "run": {
      "shell": "bash"
    }
  },
  "jobs": {
    "clients": {
      "name": "TLS / ${{ matrix.os }} / Python ${{ matrix.python }}",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 20,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "os": "windows-2025",
              "python": "3.13"
            }
          ]
        }
      },
      "steps": [
        {
          "name": "Keep bootstrap protected with the existing verified CA bundle",
          "shell": "python",
          "run": "import hashlib\nimport io\nimport os\nimport pathlib\nimport urllib.request\nimport zipfile\n\n# Verify before using: the preinstalled client's trust store may be stale.\nurl = \"https://files.pythonhosted.org/packages/32/d1/a3652fe2c19134d0d15922177821d863cbd7e842d53a21bbe7e8e3a1b5ac/certifi-2026.10.23-py3-none-any.whl\"\nwith urllib.request.urlopen(url, timeout=60) as response:\n    wheel = response.read()\nif hashlib.sha256(wheel).hexdigest() != \"e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1\":\n    raise SystemExit(\"certifi checksum mismatch\")\nbundle = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"ci-ca.pem\"\nwith zipfile.ZipFile(io.BytesIO(wheel)) as archive:\n    bundle.write_bytes(archive.read(\"certifi/cacert.pem\"))\nempty = bundle.parent / \"empty-ca-directory\"\nempty.mkdir(exist_ok=True)\nwith open(os.environ[\"GITHUB_ENV\"], \"a\", encoding=\"utf-8\") as environment:\n    for key in (\"SSL_CERT_FILE\", \"REQUESTS_CA_BUNDLE\", \"PIP_CERT\", \"GIT_SSL_CAINFO\"):\n        environment.write(f\"{key}={bundle.as_posix()}\\n\")\n    environment.write(f\"SSL_CERT_DIR={empty.as_posix()}\\n\")"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Record original image and CA package",
          "shell": "python",
          "run": "import json, os, platform, subprocess, sys\nprint(json.dumps({\"image\": os.environ.get(\"ImageVersion\"), \"platform\": platform.platform(), \"initial_python\": sys.version}))\nif sys.platform == \"linux\":\n    subprocess.run([\"dpkg-query\", \"-W\", \"ca-certificates\"], check=True)\n"
        },
        {
          "name": "Probe original OS clients without overrides",
          "run": "python .github/tls-diagnostic/probe.py clients --label original-os --only python,curl,git"
        },
        {
          "name": "Probe actual embedded action Node without overrides",
          "uses": "./.github/tls-diagnostic/node"
        },
        {
          "name": "Refresh Linux certificates for protected setup",
          "if": "runner.os == 'Linux'",
          "run": "sudo apt-get -o Acquire::Retries=3 update\nsudo apt-get -o Acquire::Retries=3 install --only-upgrade --yes ca-certificates\ndpkg-query -W ca-certificates"
        },
        {
          "name": "Compare refreshed OS clients without overrides",
          "if": "runner.os == 'Linux'",
          "run": "python .github/tls-diagnostic/probe.py clients --label refreshed-os --only python,curl,git"
        },
        {
          "name": "Stage hash-verified pip before Python setup",
          "shell": "python",
          "run": "import hashlib, os, pathlib, urllib.request\nurl, digest = os.environ[\"PIP_BOOTSTRAP_URL\"].split(\"#sha256=\")\nwith urllib.request.urlopen(url, timeout=60) as response:\n    wheel = response.read()\nassert hashlib.sha256(wheel).hexdigest() == digest, \"pip checksum mismatch\"\ndirectory = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"pip-bootstrap\"\ndirectory.mkdir(exist_ok=True)\ntarget = directory / url.rsplit(\"/\", 1)[1]\ntarget.write_bytes(wheel)\nprint(\"Verified local pip wheel:\", target)\n"
        },
        {
          "name": "Set up Python with the offline bootstrap protection",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "${{ matrix.python }}"
          },
          "env": {
            "PIP_NO_INDEX": "1",
            "PIP_FIND_LINKS": "${{ runner.temp }}/pip-bootstrap"
          }
        },
        {
          "name": "Record and probe initial selected Python and pip",
          "run": "python .github/tls-diagnostic/probe.py clients --label initial-selected-python --only python,pip"
        },
        {
          "name": "Measure the archived ensurepip client without installing anything",
          "run": "python .github/tls-diagnostic/probe.py bundled-pip"
        },
        {
          "name": "Retain patched pip bootstrap",
          "run": "python -m pip install --upgrade \"pip @ $PIP_BOOTSTRAP_URL\""
        },
        {
          "name": "Use the repository's uv version",
          "uses": "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e",
          "with": {
            "version": "0.13.5",
            "enable-cache": false
          }
        },
        {
          "name": "Install diagnostic tools using protected setup",
          "run": "uv pip install --python \"$(python -c 'import sys; print(sys.executable)')\" pre-commit \"virtualenv>=21.14.12\" \"certifi>=2026.10.19\" requests"
        },
        {
          "name": "Probe patched installation clients without overrides",
          "run": "python .github/tls-diagnostic/probe.py clients --label patched-tools --only python,pip,requests,uv"
        },
        {
          "name": "Probe fresh pre-commit and isolated build environments",
          "run": "python .github/tls-diagnostic/probe.py isolated",
          "env": {
            "PRE_COMMIT_HOME": "${{ runner.temp }}/diagnostic-pre-commit"
          }
        }
      ]
    },
    "offline_stores": {
      "name": "TLS / original stores and offline rollover chains",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Keep bootstrap protected with the existing verified CA bundle",
          "shell": "python",
          "run": "import hashlib\nimport io\nimport os\nimport pathlib\nimport urllib.request\nimport zipfile\n\n# Verify before using: the preinstalled client's trust store may be stale.\nurl = \"https://files.pythonhosted.org/packages/32/d1/a3652fe2c19134d0d15922177821d863cbd7e842d53a21bbe7e8e3a1b5ac/certifi-2026.10.23-py3-none-any.whl\"\nwith urllib.request.urlopen(url, timeout=60) as response:\n    wheel = response.read()\nif hashlib.sha256(wheel).hexdigest() != \"e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1\":\n    raise SystemExit(\"certifi checksum mismatch\")\nbundle = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"ci-ca.pem\"\nwith zipfile.ZipFile(io.BytesIO(wheel)) as archive:\n    bundle.write_bytes(archive.read(\"certifi/cacert.pem\"))\nempty = bundle.parent / \"empty-ca-directory\"\nempty.mkdir(exist_ok=True)\nwith open(os.environ[\"GITHUB_ENV\"], \"a\", encoding=\"utf-8\") as environment:\n    for key in (\"SSL_CERT_FILE\", \"REQUESTS_CA_BUNDLE\", \"PIP_CERT\", \"GIT_SSL_CAINFO\"):\n        environment.write(f\"{key}={bundle.as_posix()}\\n\")\n    environment.write(f\"SSL_CERT_DIR={empty.as_posix()}\\n\")"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Record original image and CA package",
          "shell": "python",
          "run": "import json, os, platform, subprocess, sys\nprint(json.dumps({\"image\": os.environ.get(\"ImageVersion\"), \"platform\": platform.platform(), \"initial_python\": sys.version}))\nif sys.platform == \"linux\":\n    subprocess.run([\"dpkg-query\", \"-W\", \"ca-certificates\"], check=True)\n"
        },
        {
          "name": "Measure embedded Node and export its bundled roots",
          "uses": "./.github/tls-diagnostic/node"
        },
        {
          "name": "Verify regular and rollover certificate chains offline",
          "run": "python .github/tls-diagnostic/probe.py offline"
        }
      ]
    }
  }
}
