name: Deploy to PyPI

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # Use the refreshed OS roots instead of Node's bundled certificate snapshot.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Authenticate the bootstrap even if the preinstalled pip still trusts compromised CAs.
  PIP_BOOTSTRAP_URL: https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - &refresh-certificates
        name: Refresh system certificates
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade --yes ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - &bootstrap-pip
        name: Bootstrap patched pip
        run: python -m pip install --upgrade "pip @ $PIP_BOOTSTRAP_URL"
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit "virtualenv>=21.14.12" "certifi>=2026.10.19"
          pre-commit run --all-files --show-diff-on-failure
      - name: Check GUI renderer and preview state
        run: |
          node --check src/mnt/nanoplacer/static/gui.js
          node tests/gui_renderer_check.cjs

  build_wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *refresh-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
        name: Install Python
      - *bootstrap-pip
      - &install-build-tools
        name: Install build tools
        run: python -m pip install "build>=1.5.0" twine "certifi>=2026.10.19"
      - name: Build wheel
        run: python -m build --wheel
      - name: Check wheel
        run: python -m twine check dist/*.whl
      - name: Install and test wheel
        run: |
          python -m pip install --verbose "mnt.nanoplacer[gui,test]" dist/*.whl
          python -m pytest
          python -m pip check
          mnt.nanoplacer --help
          mnt.nanoplacer.gui --help
      - if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-wheel
          path: dist/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *refresh-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
        name: Install Python
      - *bootstrap-pip
      - *install-build-tools
      - name: Build sdist
        run: python -m build --sdist
      - name: Check source distribution
        run: python -m twine check dist/*.tar.gz
      - name: Install and test source distribution
        run: |
          python -m pip install --verbose "mnt.nanoplacer[gui,test]" dist/*.tar.gz
          python -m pytest
          python -m pip check
          mnt.nanoplacer --help
          mnt.nanoplacer.gui --help
      - name: Check editable install alongside pyfiction
        run: |
          python -m pip install --no-deps -e .
          python -c "import mnt.pyfiction; import mnt.nanoplacer.gui"
          python -m pytest
      - if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  upload_pypi:
    if: github.event_name == 'release' && github.event.action == 'published'
    name: 🚀 Deploy to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mnt.nanoplacer
    permissions:
      id-token: write
    needs: [quality, build_wheel, build_sdist]
    steps:
      - *refresh-certificates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
