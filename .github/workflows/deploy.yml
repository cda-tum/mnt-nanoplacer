name: Deploy to PyPI

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build_wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
        name: Install Python
      - name: Build wheel
        run: pipx run build --wheel
      - name: Check wheel
        run: pipx run twine check dist/*.whl
      - name: Install and test wheel
        run: |
          python -m pip install --verbose pytest dist/*.whl
          python -m pytest
          python -m pip check
          mnt.nanoplacer --help
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-wheel
          path: dist/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
        name: Install Python
      - name: Build sdist
        run: pipx run build --sdist
      - name: Check source distribution
        run: pipx run twine check dist/*.tar.gz
      - name: Install and test source distribution
        run: |
          python -m pip install --verbose pytest dist/*.tar.gz
          python -m pytest
          python -m pip check
          mnt.nanoplacer --help
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  upload_pypi:
    if: github.event_name == 'release' && github.event.action == 'published'
    name: 🚀 Deploy to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mnt.nanoplacer
    permissions:
      id-token: write
    needs: [build_wheel, build_sdist]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
