[build-system]
requires = [
    "setuptools>=77.0.3",
    "setuptools-scm>=8.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "mnt.nanoplacer"
description = "NanoPlaceR - An open-source framework for placement and routing of Field-coupled Nanotechnologies based on reinforcement learning."
readme = "README.md"
authors = [
    { name = "Simon Hofmann", email = "simon.t.hofmann@tum.de" },
]
keywords = ["FCN", "physical design"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
    "gymnasium>=0.28.1",
    "mnt.pyfiction>=0.8.0",
    "networkx>=3.2.1",
    "numpy>=1.26.3",
    "sb3-contrib>=2.2.1",
    "tensorboard>=2.15.1",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
test = ["pytest>=8.2.1"]
coverage = ["mnt.nanoplacer[test]", "pytest-cov"]

[project.scripts]
"mnt.nanoplacer" = "mnt.nanoplacer.main:start"

[project.urls]
Homepage = "https://github.com/cda-tum/NanoPlaceR"
"Bug Tracker" = "https://github.com/cda-tum/NanoPlaceR/issues"
Discussions = "https://github.com/cda-tum/NanoPlaceR/discussions"
Research = "https://www.cda.cit.tum.de/research/fcn/"

# ponytail: Editable installs need mnt.pyfiction to make its regular `mnt` package extensible; wheels merge safely.
[tool.setuptools.package-data]
"mnt.nanoplacer" = ["benchmarks/*/*.v"]

[tool.setuptools_scm]

[tool.ruff]
line-length = 120
namespace-packages = ["src/mnt"]
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W", # flake8
    "A",           # flake8-builtins
    "B",           # flake8-bugbear
    "I",           # isort
    "ARG",         # flake8-unused-arguments
    "C4",          # flake8-comprehensions
    "EM",          # flake8-errmsg
    "EXE",         # flake8-executable
    "ICN",         # flake8-import-conventions
    "ISC",         # flake8-implicit-str-concat
    "PGH",         # pygrep-hooks
    "PIE",         # flake8-pie
    "PL",          # pylint
    "PT",          # flake8-pytest-style
    "PTH",         # flake8-use-pathlib
    "Q",           # flake8-quotes
    "RET",         # flake8-return
    "RUF",         # Ruff-specific
    "SIM",         # flake8-simplify
    "TCH",         # flake8-type-checking
    "UP",          # pyupgrade
    "YTT",         # flake8-2020
]
ignore = [
    "E501",    # Line too long (Ruff's formatter is enough)
    "ISC001",  # Conflicts with Ruff's formatter
    "PLR2004", # Magic values
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.codespell]
ignore-words-list = "Wille"
skip = "*.svg"
quiet-level = 3
